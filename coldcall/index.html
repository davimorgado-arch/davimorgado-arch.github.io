<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Simulador de Cold Call</title>
<style>
  :root {
    --bg:#111418; --card:#1B2027; --text:#F2F4F7; --muted:#9AA4B2;
    --green:#22C55E; --red:#EF4444; --line:#2A313B; --accent:#60A5FA;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .phone {
    width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
    border-radius:28px; padding:32px 24px; text-align:center;
  }
  .screen { display:none; }
  .screen.on { display:block; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5; }
  input {
    width:100%; padding:14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:16px; margin-bottom:16px;
  }
  .btn {
    border:0; border-radius:999px; font-size:16px; font-weight:600; cursor:pointer;
    padding:14px 28px; color:#fff;
  }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-green { background:var(--green); width:100%; }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .link { background:none; border:0; color:var(--muted); font-size:14px; cursor:pointer; margin-top:14px; text-decoration:underline; }

  /* Seleção de desafio */
  .choice {
    display:block; width:100%; text-align:left; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .choice.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .choice b { display:block; font-size:15px; margin-bottom:4px; }
  .choice span { color:var(--muted); font-size:13px; line-height:1.4; }

  /* Ficha do lead e gabarito */
  .card {
    text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:16px; font-size:14px; line-height:1.55;
  }
  .card .lbl { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px; }
  .card p { margin:0 0 4px; }
  .goal { border-color:var(--accent); }

  /* Tela de ligação */
  .avatar {
    width:96px; height:96px; border-radius:50%; margin:8px auto 16px; background:#2F3742;
    display:flex; align-items:center; justify-content:center; font-size:40px; transition:box-shadow .2s;
  }
  .avatar.speaking { box-shadow:0 0 0 6px rgba(34,197,94,.35), 0 0 0 14px rgba(34,197,94,.12); }
  .who { font-size:20px; font-weight:600; margin:0; }
  .state { color:var(--muted); font-size:15px; margin:6px 0 32px; min-height:20px; }
  .timer { font-variant-numeric:tabular-nums; }
  .controls { display:flex; justify-content:center; gap:28px; align-items:center; }
  .round {
    width:68px; height:68px; border-radius:50%; border:0; cursor:pointer; font-size:26px;
    display:flex; align-items:center; justify-content:center;
  }
  .round.mute { background:#2F3742; color:#fff; }
  .round.mute.active { background:#fff; color:#111; }
  .round.hang { background:var(--red); color:#fff; }

  .warn { color:#FCA5A5; font-size:13px; margin-top:12px; }
  .result { font-size:15px; color:var(--muted); margin:0 0 16px; line-height:1.6; }
  details { text-align:left; margin:0 0 16px; }
  summary { cursor:pointer; color:var(--muted); font-size:14px; }
  .transcript { max-height:300px; overflow-y:auto; margin-top:10px; font-size:14px; line-height:1.5; }
  .transcript p { margin:0 0 8px; }
  .transcript b { color:var(--muted); font-weight:600; }
</style>
</head>
<body>
<div class="phone">

  <!-- Tela 1: nome + escolha do desafio -->
  <div id="s-start" class="screen on">
    <h1>Simulador de Cold Call</h1>
    <p class="sub">Use fone com microfone. Escolha o desafio, leia a ficha do lead e ligue.</p>
    <input id="name" placeholder="Seu nome" autocomplete="off" maxlength="40">
    <button class="choice sel" data-ch="frio">
      <b>Desafio 1 · Lead frio</b>
      <span>Você liga para a central da empresa. Objetivo: descobrir quem é o responsável pela energia elétrica e conseguir o contato dele.</span>
    </button>
    <button class="choice" data-ch="morno">
      <b>Desafio 2 · Primeiro contato com o responsável</b>
      <span>Você já tem o nome do responsável. Objetivo: entender a situação energética da empresa e gerar interesse num próximo passo.</span>
    </button>
    <button id="btn-next" class="btn btn-green" style="margin-top:8px">Sortear lead</button>
    <p id="start-err" class="warn" hidden></p>
  </div>

  <!-- Tela 2: ficha do lead sorteado -->
  <div id="s-brief" class="screen">
    <h1 id="brief-title"></h1>
    <p class="sub">Isto é tudo o que você sabe antes de ligar.</p>
    <div id="brief" class="card"></div>
    <div id="goal" class="card goal"></div>
    <button id="btn-call" class="btn btn-green">📞 Ligar</button>
    <button id="btn-reroll" class="link">Sortear outro lead</button>
    <button id="btn-back" class="link">Voltar</button>
  </div>

  <!-- Tela 3: ligação (chamando / em andamento) -->
  <div id="s-call" class="screen">
    <div id="avatar" class="avatar">👤</div>
    <p id="call-who" class="who"></p>
    <p id="state" class="state">Chamando…</p>
    <div class="controls">
      <button id="btn-mute" class="round mute" title="Mudo" disabled>🎙️</button>
      <button id="btn-hang" class="round hang" title="Desligar">✆</button>
    </div>
  </div>

  <!-- Tela 4: fim da ligação -->
  <div id="s-end" class="screen">
    <h1>Ligação encerrada</h1>
    <p id="result" class="result"></p>
    <div class="card"><p class="lbl">Gabarito — o que o lead sabia</p><div id="answer"></div></div>
    <details>
      <summary>Ver transcrição</summary>
      <div id="transcript" class="transcript"></div>
    </details>
    <button id="btn-again" class="btn btn-ghost">Nova ligação</button>
  </div>

</div>

<!-- SDK oficial da ElevenLabs (build pronto para navegador, expõe window.ElevenLabsClient) -->
<script src="https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.27.0/dist/lib.iife.js"></script>
<script>

const MIN_RINGS = 2;           // toques mínimos antes do lead atender
const MAX_RINGS = 3;           // sorteia entre MIN e MAX para não ficar previsível

// ===== Cenários =====

    {
      ficha: { Empresa: "Frigorífico Vale do Taquari", Segmento: "Frigorífico (aves)", Cidade: "Lajeado/RS", Contato: "Alessandra Kunz, gerente financeira (indicada pelo sócio)" },

        situacao: "Mercado CATIVO na RGE, Grupo A4, demanda contratada de 900 kW. Fatura média de R$ 180 mil/mês, segundo maior custo da empresa depois da matéria-prima. Já ouviu falar de mercado livre mas acha arriscado ('um conhecido pegou preço alto e se arrependeu'). Nunca fez estudo de viabilidade. Câmaras frias rodam 24h.",

      },
      gabarito: "Cativo (RGE), Grupo A4, 900 kW, fatura ~R$ 180 mil/mês. Receio de risco no mercado livre. Próximo passo ideal: <b>receber a fatura para estudo de viabilidade</b>.",

      },
      gabarito: "Mercado livre desde 2022, contrato até dez/2027, gestão feita pela própria comercializadora. Dor: cobrança inesperada de ~R$ 40 mil na CCEE. Próximo passo ideal: <b>reunião para diagnóstico da gestão</b>.",
    },
    {
      ficha: { Empresa: "Supermercados Bom Preço Serra", Segmento: "Varejo alimentar (4 lojas)", Cidade: "Bento Gonçalves/RS", Contato: "Cláudio Ferrari, diretor de operações" },
      atende: "Cláudio Ferrari",
      vars: {
        empresa: "Supermercados Bom Preço Serra", segmento: "rede de supermercados com 4 lojas", cidade: "Bento Gonçalves/RS",
        saudacao: "Alô, Cláudio.",
        persona: "Cláudio Ferrari, 45 anos, diretor de operações. Saturado: recebe ligação de energia solar e mercado livre toda semana. Corta rápido quem parece mais um.",
        situacao: "Quatro lojas: duas em média tensão (Grupo A, CATIVAS na RGE, ~R$ 60 mil/mês cada) e duas em baixa tensão. Tem geração solar (GD) no telhado de uma loja de baixa tensão. Nunca analisou migrar as duas lojas Grupo A. Refrigeração é o maior consumo.",
        abre_se: "Vendedor que se diferencia em uma frase (não é 'mais um vendendo energia'), pergunta sobre as lojas em vez de despejar oferta, e mostra que mercado livre e solar podem conviver. Aceita mandar as faturas das duas lojas maiores se o vendedor for específico.",
        objecoes: "'Já me ligaram dez empresas essa semana'; 'Já tenho solar'; 'Me manda no WhatsApp'.",
      },
      gabarito: "2 lojas Grupo A cativas (~R$ 60 mil/mês cada) + 2 em baixa tensão, uma com solar. Nunca analisou migração. Próximo passo ideal: <b>receber as faturas das 2 lojas Grupo A</b>.",

    {
      ficha: { Empresa: "Hospital Santa Clara do Vale", Segmento: "Saúde (hospital, 180 leitos)", Cidade: "Santa Cruz do Sul/RS", Contato: "Daniela Rocha, gerente administrativa" },

      vars: {
        empresa: "Hospital Santa Clara do Vale", segmento: "hospital de 180 leitos", cidade: "Santa Cruz do Sul/RS",
        saudacao: "Daniela, {periodo}.",
        persona: "Daniela Rocha, 42 anos, gerente administrativa. Educada, organizada, mas cautelosa: hospital filantrópico, tudo passa pela diretoria.",

        abre_se: "Perguntar sobre o vencimento do contrato e como está a relação com a gestora atual; mostrar que a renovação é a janela certa para comparar; propor algo concreto (comparativo, reunião com a diretoria). Aceita reunião se o vendedor ligar isso ao vencimento.",

      },

const GOALS = {
  frio:  "Descobrir <b>quem é o responsável pela energia elétrica</b> (nome e cargo) e conseguir <b>um contato direto</b> (ramal, e-mail ou celular). Não é para vender nada.",
  morno: "Descobrir a <b>situação energética</b> (cativo ou livre, contrato, vencimento, quem faz a gestão, tamanho da conta) e sair com <b>um próximo passo concreto</b> (reunião ou envio de fatura).",
};
const TITLES = { frio: "Desafio 1 · Lead frio", morno: "Desafio 2 · Primeiro contato" };

// ===== Estado =====
let challenge = "frio";        // desafio escolhido
let scenario = null;           // cenário sorteado
let lastIdx = -1;              // evita sortear o mesmo cenário duas vezes seguidas
let conversation = null;       // sessão ativa da ElevenLabs
let ringer = null;             // controle do toque de chamada
let startedAt = 0;             // quando o lead atendeu (ms)
let timerId = null;
let endReason = "";            // "user" | "agent" | "error"
let lines = [];                // transcrição acumulada
let muted = false;

const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
const fmt = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const periodo = () => new Date().getHours() < 12 ? "bom dia" : "boa tarde";

try { $("name").value = localStorage.getItem("cc-name") || ""; } catch (e) {}

// ===== Escolha do desafio e sorteio =====
document.querySelectorAll(".choice").forEach(el => el.onclick = () => {
  challenge = el.dataset.ch;
  document.querySelectorAll(".choice").forEach(c => c.classList.toggle("sel", c === el));
});

function draw() {
  const list = SCENARIOS[challenge];
  let i;
  do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === lastIdx);
  lastIdx = i;
  scenario = list[i];
  $("brief-title").textContent = TITLES[challenge];
  $("brief").innerHTML = '<p class="lbl">Ficha do lead</p>' +
    Object.entries(scenario.ficha).map(([k, v]) => `<p><b>${k}:</b> ${v}</p>`).join("");
  $("goal").innerHTML = `<p class="lbl">Seu objetivo</p><p>${GOALS[challenge]}</p>`;
  show("s-brief");
}

$("btn-next").onclick = () => {
  const name = $("name").value.trim();
  if (!name) { $("name").focus(); return; }
  if (!AGENTS[challenge]) {
    $("start-err").textContent = "Agente deste desafio não configurado.";
    $("start-err").hidden = false;
    return;
  }
  $("start-err").hidden = true;
  try { localStorage.setItem("cc-name", name); } catch (e) {}
  draw();
};
$("btn-reroll").onclick = draw;
$("btn-back").onclick = () => show("s-start");

// ===== Toque de chamada (padrão brasileiro: 425 Hz) gerado no navegador =====
function startRinging() {
  const ctx = new AudioContext();
  let stopped = false;
  let count = 0;
  const loop = async () => {
    while (!stopped) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 425;
      gain.gain.value = 0.12;
      osc.connect(gain).connect(ctx.destination);
      osc.start(); await wait(1000); osc.stop();
      count++;
      await wait(2500);           // pausa entre toques (encurtada em relação à rede real)
    }
  };
  loop();
  return { stop() { stopped = true; ctx.close(); }, get count() { return count; } };
}

// ===== Fluxo da ligação =====
async function call() {
  // Pede o microfone antes de tocar, para o pop-up de permissão não aparecer no meio da ligação
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    alert("Sem acesso ao microfone. Libere a permissão no navegador.");
    return;
  }

  // Zera estado da ligação anterior
  lines = []; endReason = ""; muted = false; startedAt = 0;
  $("btn-mute").classList.remove("active"); $("btn-mute").disabled = true;
  $("call-who").textContent = `${scenario.vars.empresa} · ${scenario.atende}`;
  $("state").textContent = "Chamando…";
  show("s-call");

  // Toca algumas vezes antes de conectar; o toque continua até o lead "atender"
  ringer = startRinging();
  const rings = MIN_RINGS + Math.floor(Math.random() * (MAX_RINGS - MIN_RINGS + 1));
  while (ringer && ringer.count < rings) await wait(200);
  if (!ringer) return;           // vendedor desistiu enquanto chamava

  // Variáveis do cenário que vão para o prompt do agente
  const vars = { ...scenario.vars, saudacao: scenario.vars.saudacao.replace("{periodo}", periodo()) };

  try {
    conversation = await ElevenLabsClient.Conversation.startSession({
      agentId: AGENTS[challenge],
      connectionType: "webrtc",
      userId: $("name").value.trim(),   // aparece no histórico da ElevenLabs para identificar o vendedor
      dynamicVariables: vars,
      onConnect: onAnswered,
      onDisconnect: d => { endReason = endReason || d.reason; finish(); },
      onError: msg => { console.error(msg); endReason = endReason || "error"; },
      onModeChange: ({ mode }) => $("avatar").classList.toggle("speaking", mode === "speaking"),
      onMessage: m => lines.push({ role: m.role, text: m.message }),
    });
    // Vendedor desligou enquanto a conexão abria: encerra a sessão que acabou de nascer
    if (endReason === "user") await conversation.endSession();
  } catch (e) {
    console.error(e);
    endReason = "error";
    finish();
  }
}

// Lead atendeu: para o toque e inicia o cronômetro
function onAnswered() {
  if (endReason) return;         // ligação já foi cancelada
  if (ringer) { ringer.stop(); ringer = null; }
  startedAt = Date.now();
  $("btn-mute").disabled = false;
  timerId = setInterval(() => {
    $("state").innerHTML = `<span class="timer">${fmt(Date.now() - startedAt)}</span>`;
  }, 250);
}

async function hangUp() {
  endReason = endReason || "user";
  if (ringer) { ringer.stop(); ringer = null; }  // desligou ainda chamando
  if (conversation) await conversation.endSession();
  else finish();
}

// Monta a tela final
function finish() {
  if (ringer) { ringer.stop(); ringer = null; }
  clearInterval(timerId);
  conversation = null;
  $("avatar").classList.remove("speaking");

  const dur = startedAt ? fmt(Date.now() - startedAt) : "00:00";
  const reasons = {
    user: "Você encerrou a ligação.",
    agent: "O lead desligou.",
    error: "A ligação caiu (erro de conexão).",
  };
  $("result").innerHTML = `${reasons[endReason] || reasons.error}<br>Duração: <b>${dur}</b>`;
  $("answer").innerHTML = scenario ? scenario.gabarito : "";

  $("transcript").innerHTML = lines.length
    ? lines.map(l => `<p><b>${l.role === "agent" ? "Lead" : "Você"}:</b> ${escapeHtml(l.text)}</p>`).join("")
    : "<p>Sem transcrição.</p>";
  show("s-end");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

// ===== Botões =====
$("btn-call").onclick = call;
$("btn-hang").onclick = hangUp;
$("btn-again").onclick = () => show("s-start");
$("btn-mute").onclick = () => {
  if (!conversation) return;
  muted = !muted;
  conversation.setMicMuted(muted);
  $("btn-mute").classList.toggle("active", muted);
};
</script>
</body>
</html>
