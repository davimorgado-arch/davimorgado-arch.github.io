<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Cold Call</title>
<style>
  :root { --bg:#0D1015; --card:#1B2027; --text:#F2F4F7; --muted:#9AA4B2; --line:#2A313B; --accent:#7AA2F7; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; }
  nav { display:flex; justify-content:center; gap:8px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); flex:none; }
  nav button { border:1px solid var(--line); background:transparent; color:var(--muted); font-size:15px; font-weight:600;
    padding:9px 22px; border-radius:999px; cursor:pointer; }
  nav button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#0D1015; }
  iframe { flex:1; width:100%; border:0; display:block; background:var(--bg); }
  iframe[hidden] { display:none; }
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" id="aba-ranking" aria-controls="ranking" data-aba="ranking">Ranking</button>
  <button role="tab" id="aba-custos" aria-controls="custos" data-aba="custos">Custos</button>
  <button role="tab" id="aba-equipe" aria-controls="equipe" data-aba="equipe">Equipe</button>
</nav>
<!-- As páginas ficam carregadas e se atualizando; a aba só escolhe qual aparece -->
<iframe id="ranking" src="ranking.html" title="Ranking" role="tabpanel"></iframe>
<iframe id="custos" src="custos.html" title="Custos" role="tabpanel" hidden></iframe>
<iframe id="equipe" src="equipe.html" title="Equipe" role="tabpanel" hidden></iframe>
<script>
const abas = ["ranking", "custos", "equipe"];
function mostrar(nome) {
  if (!abas.includes(nome)) nome = "ranking";
  abas.forEach(a => {
    document.getElementById(a).hidden = a !== nome;
    document.getElementById("aba-" + a).setAttribute("aria-selected", String(a === nome));
  });
  if (location.hash !== "#" + nome) history.replaceState(null, "", "#" + nome);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => mostrar(b.dataset.aba)));
window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));
mostrar(location.hash.slice(1));
</script>
</body>
</html>
