<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ranking · Cold Call</title>
<style>
  :root {
    --bg:#0D1015; --card:#1B2027; --text:#F2F4F7; --muted:#9AA4B2; --line:#2A313B;
    --gold:#F5C542; --silver:#C9D1DC; --bronze:#D88B4A; --accent:#60A5FA; --green:#22C55E;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--text); overflow-x:hidden; padding:28px 16px 40px;
    background:radial-gradient(ellipse at 50% 0%, #1E2A44 0%, var(--bg) 60%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap { max-width:1000px; margin:0 auto; text-align:center; }
  h1 { font-size:clamp(28px, 5vw, 48px); margin:0; letter-spacing:-.5px; }
  .sub { color:var(--muted); margin:8px 0 28px; font-size:16px; }

  /* Pódio: ordem visual 2º · 1º · 3º */
  .podium { display:flex; justify-content:center; align-items:flex-end; gap:clamp(8px, 2vw, 20px); margin:20px 0 28px; min-height:430px; }
  .place { flex:0 1 260px; display:flex; flex-direction:column; align-items:center; }
  .who {
    min-height:150px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding:0 6px 14px; transition:opacity .4s, transform .6s cubic-bezier(.2, 1.6, .4, 1);
  }
  .place:not(.shown) .who { opacity:0; transform:translateY(30px) scale(.8); }
  .medal { font-size:clamp(40px, 6vw, 60px); line-height:1; }
  .name { font-size:clamp(17px, 2.6vw, 26px); font-weight:700; margin-top:8px; word-break:break-word; }
  .pts { font-size:clamp(15px, 2vw, 20px); font-weight:600; margin-top:4px; }
  .stats { color:var(--muted); font-size:13px; margin-top:4px; }
  .block {
    width:100%; border-radius:14px 14px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:14px; font-size:clamp(34px, 6vw, 64px); font-weight:800; color:rgba(0,0,0,.35);
    box-shadow:inset 0 -12px 0 rgba(0,0,0,.18);
  }
  .p1 .block { height:220px; background:linear-gradient(180deg, #FFE08A, var(--gold)); }
  .p2 .block { height:160px; background:linear-gradient(180deg, #EEF2F7, var(--silver)); }
  .p3 .block { height:110px; background:linear-gradient(180deg, #F0B07A, var(--bronze)); }
  .p1 .pts { color:var(--gold); } .p2 .pts { color:var(--silver); } .p3 .pts { color:var(--bronze); }
  .p1.shown .medal { animation:bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 50% { transform:translateY(-10px) rotate(-6deg); } }
  .place.empty .who { opacity:0; }

  /* Suspense: bloco piscando enquanto rufa o tambor */
  .place.drum .block { animation:pulse .25s ease-in-out infinite alternate; }
  @keyframes pulse { to { filter:brightness(1.35); transform:scaleY(1.03); } }

  /* Controles */
  .btn {
    border:0; border-radius:999px; font-size:18px; font-weight:700; cursor:pointer;
    padding:16px 34px; color:#111; background:var(--gold); box-shadow:0 6px 24px rgba(245,197,66,.35);
  }
  .btn:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  .ghost { background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:14px; margin-top:14px; }
  .hint { color:var(--muted); font-size:13px; margin-top:10px; }

  /* Demais colocados */
  .rest { max-width:640px; margin:34px auto 0; text-align:left; display:none; }
  .rest.shown { display:block; }
  .rest h2 { font-size:16px; color:var(--muted); font-weight:600; margin:0 0 10px; text-align:center; }
  .row {
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; margin-bottom:8px;
  }
  .row .pos { width:36px; font-weight:800; color:var(--muted); }
  .row .n { flex:1; font-weight:600; }
  .row .s { color:var(--muted); font-size:13px; }
  .row .p { font-weight:700; color:var(--accent); min-width:70px; text-align:right; }
  .err { color:#FCA5A5; }

  /* Confete */
  .confetti { position:fixed; top:-20px; width:10px; height:16px; border-radius:2px; pointer-events:none; z-index:10; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 Ranking · Cold Call</h1>
  <p id="sub" class="sub">Carregando…</p>

  <div class="podium">
    <div class="place p2" id="pl-2"><div class="who"></div><div class="block">2</div></div>
    <div class="place p1" id="pl-1"><div class="who"></div><div class="block">1</div></div>
    <div class="place p3" id="pl-3"><div class="who"></div><div class="block">3</div></div>
  </div>

  <button id="btn" class="btn" disabled>Revelar</button>
  <div class="hint">Atalho: barra de espaço revela o próximo</div>
  <button id="reload" class="ghost">Atualizar dados e recomeçar</button>

  <div id="rest" class="rest"></div>
</div>

<script>
// ===== Configuração =====
// URL do Apps Script publicado como app da web. Também aceita ?api=... na URL.
const API_URL = new URLSearchParams(location.search).get("api") || "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };

let ranking = [];   // [{vendedor, pontos, ligacoes, objetivos, secretos}] já ordenado
let steps = [];     // sequência de revelação: "rest", 3, 2, 1
let busy = false;

// ===== Dados =====
async function load() {
  $("btn").disabled = true;
  $("sub").textContent = "Carregando…";
  if (!API_URL) { $("sub").innerHTML = '<span class="err">Ranking não configurado (URL da planilha).</span>'; return; }
  try {
    const data = await (await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "acao=ranking")).json();
    ranking = data.ranking || [];
    reset();
  } catch (e) {
    console.error(e);
    $("sub").innerHTML = '<span class="err">Não foi possível carregar o ranking.</span>';
  }
}

// Prepara o pódio vazio e a sequência de revelação
function reset() {
  [1, 2, 3].forEach(p => {
    const el = $("pl-" + p);
    el.classList.remove("shown", "drum");
    const r = ranking[p - 1];
    el.classList.toggle("empty", !r);
    el.querySelector(".who").innerHTML = r ? `
      <div class="medal">${MEDALS[p]}</div>
      <div class="name">${esc(r.vendedor)}</div>
      <div class="pts">${r.pontos} pts</div>
      <div class="stats">${r.ligacoes} ligação(ões) · ${r.objetivos} ✔ · ${r.secretos} ★</div>` : "";
  });
  $("rest").classList.remove("shown");
  $("rest").innerHTML = ranking.length > 3 ? "<h2>Demais colocados</h2>" + ranking.slice(3).map((r, i) => `
    <div class="row">
      <span class="pos">${i + 4}º</span>
      <span class="n">${esc(r.vendedor)}</span>
      <span class="s">${r.ligacoes} lig. · ${r.objetivos} ✔ · ${r.secretos} ★</span>
      <span class="p">${r.pontos} pts</span>
    </div>`).join("") : "";

  steps = [];
  if (ranking.length > 3) steps.push("rest");
  [3, 2, 1].forEach(p => { if (ranking[p - 1]) steps.push(p); });

  const total = ranking.reduce((s, r) => s + r.ligacoes, 0);
  $("sub").textContent = ranking.length
    ? `${ranking.length} participante(s) · ${total} ligação(ões) avaliada(s)`
    : "Nenhuma ligação avaliada ainda.";
  updateButton();
}

function updateButton() {
  const next = steps[0];
  $("btn").disabled = !next || busy;
  $("btn").textContent = !next ? "🎉 Parabéns a todos!"
    : next === "rest" ? "Revelar 4º em diante"
    : `Revelar ${next}º lugar`;
}

// ===== Revelação =====
async function revealNext() {
  if (busy || !steps.length) return;
  busy = true; updateButton();
  const step = steps.shift();
  if (step === "rest") {
    $("rest").classList.add("shown");
  } else {
    const el = $("pl-" + step);
    el.classList.add("drum");
    await drumroll(step === 1 ? 2600 : 1600);   // suspense maior para o 1º lugar
    el.classList.remove("drum");
    el.classList.add("shown");
    cymbal();
    if (step === 1) confetti(220);
    else if (step === 2) confetti(60);
  }
  busy = false; updateButton();
}

// ===== Efeitos sonoros (Web Audio, sem arquivos externos) =====
let actx = null;
const audio = () => (actx = actx || new AudioContext());

// Rufar de tambor: batidas de ruído cada vez mais rápidas
async function drumroll(ms) {
  const ctx = audio();
  const end = ctx.currentTime + ms / 1000;
  let t = ctx.currentTime, gap = 0.09;
  while (t < end) {
    hit(ctx, t, 0.05, 0.25);
    t += gap; gap = Math.max(0.035, gap * 0.97);
  }
  await wait(ms);
}

// Prato no fim da revelação
function cymbal() { const ctx = audio(); hit(ctx, ctx.currentTime, 1.2, 0.5, 5000); }

// Ruído curto filtrado = batida de percussão
function hit(ctx, when, dur, vol, freq = 900) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filter = ctx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.value = freq;
  const gain = ctx.createGain(); gain.gain.value = vol;
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start(when);
}

// ===== Confete =====
function confetti(n) {
  const colors = ["#F5C542", "#60A5FA", "#22C55E", "#EF4444", "#A78BFA", "#F472B6", "#fff"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * 0.8 + "s";
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

// ===== Controles =====
$("btn").onclick = revealNext;
$("reload").onclick = load;
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); revealNext(); } });
load();
</script>
</body>
</html>
