<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorne</title>
<style>
  :root { --terra:#C1552F; --cream:#F5EFE6; --dark:#26211D; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--terra); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .mark { width:96px; height:96px; margin-bottom:8px; }
  h1 { font-size:44px; margin:8px 0 4px; font-weight:700; letter-spacing:-0.5px; }
  p { font-size:17px; opacity:.92; max-width:340px; margin:6px auto; line-height:1.5; }
</style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="29 14.5 91 91" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="o"><rect x="46.5" y="11.5" width="56" height="56" rx="13.5" transform="rotate(45 50 50)"/></clipPath></defs>
      <g clip-path="url(#o)">
        <path d="M 50 15 L 50 50 L 85 50 Z" transform="rotate(45 50 50)" fill="#fff"/>
        <rect x="50" y="15" width="49" height="49" rx="10" transform="rotate(45 50 50)" fill="none" stroke="#fff" stroke-width="7"/>
      </g>
    </svg>
    <h1>Jorne</h1>
    <p>Organize sua viagem em grupo: itinerário, localização ao vivo, câmbio e tradutor — tudo num app só.</p>
    <p style="opacity:.7;font-size:14px;">Convites para viagens abrem direto no app.</p>
  </div>
</body>
</html>
