<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite · Jorne</title>
<style>
  :root { --terra:#C1552F; --cream:#F5EFE6; --dark:#26211D; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--terra); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .mark { width:84px; height:84px; margin-bottom:8px; }
  h1 { font-size:30px; margin:8px 0; font-weight:700; }
  p { font-size:17px; opacity:.92; max-width:340px; margin:8px auto; line-height:1.5; }
  .btn {
    display:inline-block; margin-top:18px; padding:14px 26px; border-radius:12px;
    background:#fff; color:var(--terra); font-weight:600; font-size:17px; text-decoration:none;
  }
  .small { opacity:.72; font-size:14px; margin-top:22px; }
</style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="29 14.5 91 91" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="o"><rect x="46.5" y="11.5" width="56" height="56" rx="13.5" transform="rotate(45 50 50)"/></clipPath></defs>
      <g clip-path="url(#o)">
        <path d="M 50 15 L 50 50 L 85 50 Z" transform="rotate(45 50 50)" fill="#fff"/>
        <rect x="50" y="15" width="49" height="49" rx="10" transform="rotate(45 50 50)" fill="none" stroke="#fff" stroke-width="7"/>
      </g>
    </svg>
    <h1>Você foi convidado!</h1>
    <p>Toque no botão para abrir a viagem no app Jorne.</p>
    <a class="btn" id="openBtn" href="#">Abrir no app</a>
    <p class="small" id="hint">Se o app não abrir, é porque ele ainda não está instalado neste iPhone.</p>
  </div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var trip = params.get("trip");
    var code = params.get("code");
    var scheme = "viagem://join";
    if (trip) scheme += "?trip=" + encodeURIComponent(trip);
    else if (code) scheme += "?code=" + encodeURIComponent(code);
    var btn = document.getElementById("openBtn");
    btn.setAttribute("href", scheme);
    setTimeout(function(){ window.location.href = scheme; }, 300);
  })();
</script>
</body>
</html>
